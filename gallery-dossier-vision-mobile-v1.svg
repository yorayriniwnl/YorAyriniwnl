<svg xmlns="http://www.w3.org/2000/svg" width="600" height="3041" viewBox="0 0 600 3041" role="img" aria-labelledby="title description" data-gallery="proof-gallery-v1" data-layout="mobile">
<title id="title">AI vs. Real Image Detector / engineering notes</title><desc id="description">Live. Upload interface inspected. 78% held-out test accuracy Sub-two-second local inference Lighting-invariant preprocessing</desc>
<defs><style>
.sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:GalleryDisplay,Georgia,serif;font-weight:600}
.thread{stroke-dasharray:70 900;animation:thread 16s linear infinite}
@keyframes thread{to{stroke-dashoffset:-970}}
@media(prefers-reduced-motion:reduce){.thread{animation:none;stroke-dasharray:none;opacity:.45}}
</style>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101014"/><stop offset=".5" stop-color="#09070a"/><stop offset="1" stop-color="#210c12"/></linearGradient>
<linearGradient id="filament"><stop stop-color="#48101f"/><stop offset=".5" stop-color="#e84b4b"/><stop offset="1" stop-color="#ffd2bf"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#e84b4b" stop-opacity=".19"/><stop offset="1" stop-color="#e84b4b" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="598" height="3039" rx="14" fill="url(#surface)" stroke="#482029"/>
<text x="36" y="64" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >UNDER THE HOOD</text><text x="36" y="126" font-size="50" fill="#f5eaea" class="sans" text-anchor="start" data-text-role="body" >AI vs. Real Image</text><text x="36" y="193.5" font-size="50" fill="#f5eaea" class="sans" text-anchor="start" data-text-role="body" >Detector</text><path d="M36 274.0H564" stroke="#482029"/><path d="M36 274.0H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="326" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >01 / PURPOSE</text><text x="36" y="389" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >A probability-aware image</text><text x="36" y="445.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >classifier built from</text><text x="36" y="502.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >handcrafted texture</text><text x="36" y="559.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >features and a calibrated</text><text x="36" y="615.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >support vector machine.</text><path d="M36 705.5H564" stroke="#482029"/><path d="M36 705.5H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="757.5" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >02 / SYSTEM</text><text x="36" y="820.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Grayscale input is resized</text><text x="36" y="877.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >to 224 by 224. LBP,</text><text x="36" y="933.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >GLCM, and noise features</text><text x="36" y="990.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >are standardized before</text><text x="36" y="1047.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >SVM classification. The</text><text x="36" y="1104" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >public deployment uses</text><text x="36" y="1160.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Flask; Streamlit is the local</text><text x="36" y="1217.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >interface.</text><path d="M36 1307.1H564" stroke="#482029"/><path d="M36 1307.1H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="1359.1" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >03 / EVIDENCE</text><text x="36" y="1422.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >78% held-out test</text><text x="36" y="1478.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >accuracy /</text><text x="36" y="1535.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Sub-two-second local</text><text x="36" y="1592.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >inference /</text><text x="36" y="1648.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Lighting-invariant</text><text x="36" y="1705.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >preprocessing</text><path d="M36 1795.3H564" stroke="#482029"/><path d="M36 1795.3H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="1847.3" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >04 / REVIEW SCOPE</text><text x="36" y="1910.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >The 78% held-out result</text><text x="36" y="1967" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >and sub-two-second local</text><text x="36" y="2023.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >inference are</text><text x="36" y="2080.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >resume-reported. The</text><text x="36" y="2137.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >repository reports</text><text x="36" y="2193.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >approximately 77-80%</text><text x="36" y="2250.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >accuracy on a curated</text><text x="36" y="2307.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >dataset. This visit verified</text><text x="36" y="2363.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >the upload interface, not</text><text x="36" y="2420.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >inference or</text><text x="36" y="2477.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >generalization.</text><path d="M36 2567.0H564" stroke="#482029"/><path d="M36 2567.0H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="2619" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >05 / STACK</text><text x="36" y="2682" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Python / OpenCV /</text><text x="36" y="2738.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Scikit-Learn / LBP / GLCM</text><text x="36" y="2795.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >/ SVM / Streamlit</text><text x="36" y="2897.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Source review:</text><text x="36" y="2953.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >2026-08-31</text>
</svg>