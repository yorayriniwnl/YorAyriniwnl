<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1269" viewBox="0 0 900 1269" role="img" aria-labelledby="title description" data-gallery="proof-gallery-v1" data-layout="desktop">
<title id="title">Yor Zenith / engineering notes</title><desc id="description">Live. Public interface inspected. Interactive panel-placement simulation Energy-output modeling across roof configurations Subsidy, ROI, and payback analysis</desc>
<defs><style>
.sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:GalleryDisplay,Georgia,serif;font-weight:600}
.thread{stroke-dasharray:70 900;animation:thread 16s linear infinite}
@keyframes thread{to{stroke-dashoffset:-970}}
@media(prefers-reduced-motion:reduce){.thread{animation:none;stroke-dasharray:none;opacity:.45}}
</style>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101014"/><stop offset=".5" stop-color="#09070a"/><stop offset="1" stop-color="#210c12"/></linearGradient>
<linearGradient id="filament"><stop stop-color="#48101f"/><stop offset=".5" stop-color="#e84b4b"/><stop offset="1" stop-color="#ffd2bf"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#e84b4b" stop-opacity=".19"/><stop offset="1" stop-color="#e84b4b" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="898" height="1267" rx="14" fill="url(#surface)" stroke="#482029"/>
<text x="40" y="64" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >UNDER THE HOOD</text><text x="40" y="126" font-size="34" fill="#f5eaea" class="sans" text-anchor="start" data-text-role="body" >Yor Zenith</text><path d="M36 184.9H864" stroke="#482029"/><path d="M36 184.9H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="236.9" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >01 / PURPOSE</text><text x="40" y="275.9" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >A full-stack solar feasibility platform combining 3D roof planning,</text><text x="40" y="311" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >energy-output simulation, and financial analysis.</text><path d="M36 379.09999999999997H864" stroke="#482029"/><path d="M36 379.09999999999997H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="431.1" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >02 / SYSTEM</text><text x="40" y="470.1" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >The product brings rooftop planning, energy modeling, and financial</text><text x="40" y="505.2" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >assumptions into a decision-support workflow.</text><path d="M36 573.3H864" stroke="#482029"/><path d="M36 573.3H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="625.3" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >03 / EVIDENCE</text><text x="40" y="664.3" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Interactive panel-placement simulation / Energy-output modeling</text><text x="40" y="699.4" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >across roof configurations / Subsidy, ROI, and payback analysis</text><path d="M36 767.5H864" stroke="#482029"/><path d="M36 767.5H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="819.5" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >04 / REVIEW SCOPE</text><text x="40" y="858.5" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >The published interface was inspected. Financial projections are</text><text x="40" y="893.6" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >model estimates, not guarantees. This review did not validate tariff,</text><text x="40" y="928.7" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >subsidy, or investment assumptions, or complete an authenticated</text><text x="40" y="963.8" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >analysis.</text><path d="M36 1031.9H864" stroke="#482029"/><path d="M36 1031.9H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="1083.9" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >05 / STACK</text><text x="40" y="1122.9" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >React / TypeScript / Three.js / Python / FastAPI</text><text x="40" y="1203" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Source review: 2026-08-31</text>
</svg>