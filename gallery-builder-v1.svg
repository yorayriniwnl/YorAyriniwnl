<text x="40" y="64" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >AYUSH ROY / INDIA</text><path d="M36 105H864" stroke="#482029"/><path d="M36 105H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="158" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >NETWORKS / BSNL</text><text x="40" y="197" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Telecom &amp; Data Network Intern. June 2026. Completed an</text><text x="40" y="232.1" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >RGMTTC-certified four-week program in telecom, data-network</text><text x="40" y="267.2" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >systems, and infrastructure.</text><path d="M36 337.3H864" stroke="#482029"/><path d="M36 337.3H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="390.3" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >EDUCATION / KIIT</text><text x="40" y="429.3" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >B.Tech in Computer Science and Communication Engineering.</text><text x="40" y="464.4" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >2023-2027 (Expected).</text><path d="M36 534.5H864" stroke="#482029"/><path d="M36 534.5H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="587.5" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >CURRENTLY EXPLORING</text><text x="40" y="626.5" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >LLMs, RAG, AI agents, and AWS. Learning direction, separate from</text><text x="40" y="661.6" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >demonstrated project work.</text>
