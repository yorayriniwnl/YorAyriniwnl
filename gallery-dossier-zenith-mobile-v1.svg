<rect x="1" y="1" width="598" height="2688" rx="14" fill="url(#surface)" stroke="#482029"/>
<text x="36" y="64" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >UNDER THE HOOD</text><text x="36" y="126" font-size="50" fill="#f5eaea" class="sans" text-anchor="start" data-text-role="body" >Yor Zenith</text><path d="M36 206.5H564" stroke="#482029"/><path d="M36 206.5H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="258.5" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >01 / PURPOSE</text><text x="36" y="321.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >A full-stack solar feasibility</text><text x="36" y="378.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >platform combining 3D</text><text x="36" y="434.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >roof planning,</text><text x="36" y="491.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >energy-output simulation,</text><text x="36" y="548.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >and financial analysis.</text><path d="M36 638.0H564" stroke="#482029"/><path d="M36 638.0H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="690" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >02 / SYSTEM</text><text x="36" y="753" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >The product brings rooftop</text><text x="36" y="809.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >planning, energy</text><text x="36" y="866.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >modeling, and financial</text><text x="36" y="923.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >assumptions into a</text><text x="36" y="979.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >decision-support workflow.</text><path d="M36 1069.5H564" stroke="#482029"/><path d="M36 1069.5H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="1121.5" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >03 / EVIDENCE</text><text x="36" y="1184.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Interactive</text><text x="36" y="1241.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >panel-placement</text><text x="36" y="1297.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >simulation / Energy-output</text><text x="36" y="1354.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >modeling across roof</text><text x="36" y="1411.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >configurations / Subsidy,</text><text x="36" y="1468" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >ROI, and payback analysis</text><path d="M36 1557.7H564" stroke="#482029"/><path d="M36 1557.7H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="1609.7" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >04 / REVIEW SCOPE</text><text x="36" y="1672.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >The published interface</text><text x="36" y="1729.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >was inspected. Financial</text><text x="36" y="1786.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >projections are model</text><text x="36" y="1842.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >estimates, not guarantees.</text><text x="36" y="1899.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >This review did not</text><text x="36" y="1956.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >validate tariff, subsidy, or</text><text x="36" y="2012.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >investment assumptions,</text><text x="36" y="2069.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >or complete an</text><text x="36" y="2126.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >authenticated analysis.</text><path d="M36 2216.0H564" stroke="#482029"/><path d="M36 2216.0H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="2268" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >05 / STACK</text><text x="36" y="2331" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >React / TypeScript /</text><text x="36" y="2387.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Three.js / Python /</text><text x="36" y="2444.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >FastAPI</text><text x="36" y="2546.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Source review:</text><text x="36" y="2602.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >2026-08-31</text>
</svg>