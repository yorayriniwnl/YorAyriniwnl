<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2974" viewBox="0 0 600 2974" role="img" aria-labelledby="title description" data-gallery="proof-gallery-v1" data-layout="mobile">
<title id="title">Yor Talks V2 / engineering notes</title><desc id="description">Live. Current source inspected. Socket.IO realtime communication Express APIs with Postgres and Drizzle persistence React and Vite interface with shared TypeScript packages</desc>
<defs><style>
.sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:GalleryDisplay,Georgia,serif;font-weight:600}
.thread{stroke-dasharray:70 900;animation:thread 16s linear infinite}
@keyframes thread{to{stroke-dashoffset:-970}}
@media(prefers-reduced-motion:reduce){.thread{animation:none;stroke-dasharray:none;opacity:.45}}
</style>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101014"/><stop offset=".5" stop-color="#09070a"/><stop offset="1" stop-color="#210c12"/></linearGradient>
<linearGradient id="filament"><stop stop-color="#48101f"/><stop offset=".5" stop-color="#e84b4b"/><stop offset="1" stop-color="#ffd2bf"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#e84b4b" stop-opacity=".19"/><stop offset="1" stop-color="#e84b4b" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="598" height="2972" rx="14" fill="url(#surface)" stroke="#482029"/>
<text x="36" y="64" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >UNDER THE HOOD</text><text x="36" y="126" font-size="50" fill="#f5eaea" class="sans" text-anchor="start" data-text-role="body" >Yor Talks V2</text><path d="M36 206.5H564" stroke="#482029"/><path d="M36 206.5H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="258.5" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >01 / PURPOSE</text><text x="36" y="321.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >A social platform</text><text x="36" y="378.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >connecting profiles, feeds,</text><text x="36" y="434.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >communities, and</text><text x="36" y="491.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >conversations through a</text><text x="36" y="548.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >React frontend and an</text><text x="36" y="605" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Express API.</text><path d="M36 694.7H564" stroke="#482029"/><path d="M36 694.7H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="746.7" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >02 / SYSTEM</text><text x="36" y="809.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >React and Vite connect to</text><text x="36" y="866.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >an Express and Socket.IO</text><text x="36" y="923.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >API. Shared TypeScript</text><text x="36" y="979.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >packages, Postgres, and</text><text x="36" y="1036.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Drizzle support the</text><text x="36" y="1093.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >application.</text><text x="36" y="1149.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Provider-backed</text><text x="36" y="1206.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >functionality depends on</text><text x="36" y="1263.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >deployment configuration.</text><path d="M36 1353.0H564" stroke="#482029"/><path d="M36 1353.0H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="1405" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >03 / EVIDENCE</text><text x="36" y="1468" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Socket.IO realtime</text><text x="36" y="1524.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >communication / Express</text><text x="36" y="1581.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >APIs with Postgres and</text><text x="36" y="1638.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Drizzle persistence / React</text><text x="36" y="1694.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >and Vite interface with</text><text x="36" y="1751.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >shared TypeScript</text><text x="36" y="1808.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >packages</text><path d="M36 1897.9H564" stroke="#482029"/><path d="M36 1897.9H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="1949.9" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >04 / REVIEW SCOPE</text><text x="36" y="2012.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Current repository</text><text x="36" y="2069.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >documentation confirms</text><text x="36" y="2126.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >the stack. This profile</text><text x="36" y="2183" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >review did not sign in or</text><text x="36" y="2239.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >verify message delivery,</text><text x="36" y="2296.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >moderation, payments, or</text><text x="36" y="2353.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >production readiness.</text><path d="M36 2442.8H564" stroke="#482029"/><path d="M36 2442.8H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="2494.8" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >05 / STACK</text><text x="36" y="2557.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >React / Vite / TypeScript /</text><text x="36" y="2614.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Express / Socket.IO /</text><text x="36" y="2671.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Postgres / Drizzle /</text><text x="36" y="2727.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Tailwind CSS</text><text x="36" y="2829.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Source review:</text><text x="36" y="2886.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >2026-08-31</text>
</svg>