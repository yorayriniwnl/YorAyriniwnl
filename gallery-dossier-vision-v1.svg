<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1304" viewBox="0 0 900 1304" role="img" aria-labelledby="title description" data-gallery="proof-gallery-v1" data-layout="desktop">
<title id="title">AI vs. Real Image Detector / engineering notes</title><desc id="description">Live. Upload interface inspected. 78% held-out test accuracy Sub-two-second local inference Lighting-invariant preprocessing</desc>
<defs><style>
.sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:GalleryDisplay,Georgia,serif;font-weight:600}
.thread{stroke-dasharray:70 900;animation:thread 16s linear infinite}
@keyframes thread{to{stroke-dashoffset:-970}}
@media(prefers-reduced-motion:reduce){.thread{animation:none;stroke-dasharray:none;opacity:.45}}
</style>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101014"/><stop offset=".5" stop-color="#09070a"/><stop offset="1" stop-color="#210c12"/></linearGradient>
<linearGradient id="filament"><stop stop-color="#48101f"/><stop offset=".5" stop-color="#e84b4b"/><stop offset="1" stop-color="#ffd2bf"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#e84b4b" stop-opacity=".19"/><stop offset="1" stop-color="#e84b4b" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="898" height="1302" rx="14" fill="url(#surface)" stroke="#482029"/>
<text x="40" y="64" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >UNDER THE HOOD</text><text x="40" y="126" font-size="34" fill="#f5eaea" class="sans" text-anchor="start" data-text-role="body" >AI vs. Real Image Detector</text><path d="M36 184.9H864" stroke="#482029"/><path d="M36 184.9H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="236.9" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >01 / PURPOSE</text><text x="40" y="275.9" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >A probability-aware image classifier built from handcrafted texture</text><text x="40" y="311" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >features and a calibrated support vector machine.</text><path d="M36 379.09999999999997H864" stroke="#482029"/><path d="M36 379.09999999999997H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="431.1" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >02 / SYSTEM</text><text x="40" y="470.1" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Grayscale input is resized to 224 by 224. LBP, GLCM, and noise</text><text x="40" y="505.2" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >features are standardized before SVM classification. The public</text><text x="40" y="540.3" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >deployment uses Flask; Streamlit is the local interface.</text><path d="M36 608.4H864" stroke="#482029"/><path d="M36 608.4H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="660.4" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >03 / EVIDENCE</text><text x="40" y="699.4" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >78% held-out test accuracy / Sub-two-second local inference /</text><text x="40" y="734.5" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Lighting-invariant preprocessing</text><path d="M36 802.6H864" stroke="#482029"/><path d="M36 802.6H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="854.6" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >04 / REVIEW SCOPE</text><text x="40" y="893.6" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >The 78% held-out result and sub-two-second local inference are</text><text x="40" y="928.7" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >resume-reported. The repository reports approximately 77-80%</text><text x="40" y="963.8" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >accuracy on a curated dataset. This visit verified the upload</text><text x="40" y="998.9" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >interface, not inference or generalization.</text><path d="M36 1067.0H864" stroke="#482029"/><path d="M36 1067.0H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="1119" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >05 / STACK</text><text x="40" y="1158" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Python / OpenCV / Scikit-Learn / LBP / GLCM / SVM / Streamlit</text><text x="40" y="1238.1" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Source review: 2026-08-31</text>
</svg>