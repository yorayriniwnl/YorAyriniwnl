name: Build stats cards

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch: {}     # manual "run now" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "data/profile.json"
      - "scripts/generate_stats.py"
      - "scripts/profile_data.py"
      - "scripts/gallery.py"
      - "requirements-profile.txt"
      - ".github/workflows/build-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (source)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shared renderer dependencies
        run: python -m pip install -r main/requirements-profile.txt

      - name: Fetch live data + render stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a classic PAT with the `read:user` scope, added under
          # Settings -> Secrets and variables -> Actions -> New repository
          # secret, named STATS_TOKEN. Without it, the middle card renders
          # a system-status panel instead of exposing configuration text.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python main/scripts/generate_stats.py

      - name: Checkout output (generated artifacts)
        uses: actions/checkout@v4
        with:
          ref: output
          path: output

      - name: Copy generated card into output branch
        run: |
          cp main/generated/stats.svg output/
          cp main/generated/gallery-record*.svg output/
          cp main/generated/public-record.json output/

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: output
          commit_message: "chore: refresh stats cards"
          branch: output
