<text x="40" y="64" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >UNDER THE HOOD</text><text x="40" y="126" font-size="34" fill="#f5eaea" class="sans" text-anchor="start" data-text-role="body" >Yor Feelings</text><path d="M36 184.9H864" stroke="#482029"/><path d="M36 184.9H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="236.9" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >01 / PURPOSE</text><text x="40" y="275.9" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >An expressive web experience translating sentiment and mood</text><text x="40" y="311" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >signals into responsive interface state.</text><path d="M36 379.09999999999997H864" stroke="#482029"/><path d="M36 379.09999999999997H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="431.1" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >02 / SYSTEM</text><text x="40" y="470.1" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >An experimental exploration of mood-responsive interface state.</text><path d="M36 538.2H864" stroke="#482029"/><path d="M36 538.2H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="590.2" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >03 / EVIDENCE</text><text x="40" y="629.2" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Mood-responsive visual state / Experimental interaction design</text><path d="M36 697.3000000000001H864" stroke="#482029"/><path d="M36 697.3000000000001H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="749.3" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >04 / REVIEW SCOPE</text><text x="40" y="788.3" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >The recorded deployment currently presents an Echo-branded</text><text x="40" y="823.4" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >campus application. The gallery links to the project source rather</text><text x="40" y="858.5" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >than presenting that destination as a verified Feelings demo.</text><path d="M36 926.6000000000001H864" stroke="#482029"/><path d="M36 926.6000000000001H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="978.6" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >05 / STACK</text><text x="40" y="1017.6" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Next.js / TypeScript</text><text x="40" y="1097.7" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Source review: 2026-08-31</text>
