<rect x="1" y="1" width="898" height="1372" rx="14" fill="url(#surface)" stroke="#482029"/>
<text x="40" y="64" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >UNDER THE HOOD</text><text x="40" y="126" font-size="34" fill="#f5eaea" class="sans" text-anchor="start" data-text-role="body" >Yor Talks V2</text><path d="M36 184.9H864" stroke="#482029"/><path d="M36 184.9H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="236.9" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >01 / PURPOSE</text><text x="40" y="275.9" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >A social platform connecting profiles, feeds, communities, and</text><text x="40" y="311" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >conversations through a React frontend and an Express API.</text><path d="M36 379.09999999999997H864" stroke="#482029"/><path d="M36 379.09999999999997H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="431.1" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >02 / SYSTEM</text><text x="40" y="470.1" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >React and Vite connect to an Express and Socket.IO API. Shared</text><text x="40" y="505.2" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >TypeScript packages, Postgres, and Drizzle support the</text><text x="40" y="540.3" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >application. Provider-backed functionality depends on deployment</text><text x="40" y="575.4" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >configuration.</text><path d="M36 643.5H864" stroke="#482029"/><path d="M36 643.5H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="695.5" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >03 / EVIDENCE</text><text x="40" y="734.5" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Socket.IO realtime communication / Express APIs with Postgres</text><text x="40" y="769.6" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >and Drizzle persistence / React and Vite interface with shared</text><text x="40" y="804.7" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >TypeScript packages</text><path d="M36 872.8H864" stroke="#482029"/><path d="M36 872.8H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="924.8" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >04 / REVIEW SCOPE</text><text x="40" y="963.8" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Current repository documentation confirms the stack. This profile</text><text x="40" y="998.9" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >review did not sign in or verify message delivery, moderation,</text><text x="40" y="1034" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >payments, or production readiness.</text><path d="M36 1102.1H864" stroke="#482029"/><path d="M36 1102.1H106" stroke="#ff9d91" stroke-width="2"/><text x="40" y="1154.1" font-size="26" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >05 / STACK</text><text x="40" y="1193.1" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >React / Vite / TypeScript / Express / Socket.IO / Postgres / Drizzle /</text><text x="40" y="1228.2" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Tailwind CSS</text><text x="40" y="1308.3" font-size="26" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Source review: 2026-08-31</text>
</svg>