<text x="36" y="64" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >AYUSH ROY / INDIA</text><path d="M36 105H564" stroke="#482029"/><path d="M36 105H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="158" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >NETWORKS / BSNL</text><text x="36" y="221" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Telecom &amp; Data Network</text><text x="36" y="277.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Intern. June 2026.</text><text x="36" y="334.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Completed an</text><text x="36" y="391.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >RGMTTC-certified</text><text x="36" y="447.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >four-week program in</text><text x="36" y="504.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >telecom, data-network</text><text x="36" y="561.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >systems, and</text><text x="36" y="617.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >infrastructure.</text><path d="M36 709.6H564" stroke="#482029"/><path d="M36 709.6H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="762.6" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >EDUCATION / KIIT</text><text x="36" y="825.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >B.Tech in Computer</text><text x="36" y="882.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Science and</text><text x="36" y="939" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Communication</text><text x="36" y="995.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Engineering. 2023-2027</text><text x="36" y="1052.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >(Expected).</text><path d="M36 1144.1H564" stroke="#482029"/><path d="M36 1144.1H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="1197.1" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >CURRENTLY EXPLORING</text><text x="36" y="1260.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >LLMs, RAG, AI agents,</text><text x="36" y="1316.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >and AWS. Learning</text><text x="36" y="1373.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >direction, separate from</text><text x="36" y="1430.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >demonstrated project</text><text x="36" y="1486.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >work.</text>
