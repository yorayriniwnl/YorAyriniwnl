<text x="36" y="64" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >UNDER THE HOOD</text><text x="36" y="126" font-size="50" fill="#f5eaea" class="sans" text-anchor="start" data-text-role="body" >Yor Helios</text><path d="M36 206.5H564" stroke="#482029"/><path d="M36 206.5H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="258.5" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >01 / PURPOSE</text><text x="36" y="321.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >An energy-monitoring</text><text x="36" y="378.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >platform streaming</text><text x="36" y="434.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >anomaly and threshold</text><text x="36" y="491.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >events into</text><text x="36" y="548.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >channel-specific operator</text><text x="36" y="605" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >dashboards.</text><path d="M36 694.7H564" stroke="#482029"/><path d="M36 694.7H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="746.7" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >02 / SYSTEM</text><text x="36" y="809.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >FastAPI and WebSocket</text><text x="36" y="866.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >connections route</text><text x="36" y="923.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >anomaly and threshold</text><text x="36" y="979.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >events into</text><text x="36" y="1036.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >channel-specific</text><text x="36" y="1093.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >dashboards, with Docker</text><text x="36" y="1149.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Compose for the local</text><text x="36" y="1206.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >environment.</text><path d="M36 1296.3000000000002H564" stroke="#482029"/><path d="M36 1296.3000000000002H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="1348.3" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >03 / EVIDENCE</text><text x="36" y="1411.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Bidirectional realtime alert</text><text x="36" y="1468" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >streaming / Continuous</text><text x="36" y="1524.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >anomaly and threshold</text><text x="36" y="1581.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >engine / One-command</text><text x="36" y="1638.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Docker Compose</text><text x="36" y="1694.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >environment</text><path d="M36 1784.5000000000002H564" stroke="#482029"/><path d="M36 1784.5000000000002H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="1836.5" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >04 / REVIEW SCOPE</text><text x="36" y="1899.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Public repository available.</text><text x="36" y="1956.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >No public deployment or</text><text x="36" y="2012.9" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >end-to-end demonstration</text><text x="36" y="2069.6" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >was verified. The signal</text><text x="36" y="2126.3" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >illustration is an</text><text x="36" y="2183" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >architecture motif, not live</text><text x="36" y="2239.7" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >telemetry.</text><path d="M36 2329.4H564" stroke="#482029"/><path d="M36 2329.4H106" stroke="#ff9d91" stroke-width="2"/><text x="36" y="2381.4" font-size="42" fill="#ff9d91" class="sans" text-anchor="start" data-text-role="caption" >05 / STACK</text><text x="36" y="2444.4" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Python / FastAPI /</text><text x="36" y="2501.1" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >TypeScript / Docker /</text><text x="36" y="2557.8" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >WebSocket</text><text x="36" y="2659.5" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >Source review:</text><text x="36" y="2716.2" font-size="42" fill="#c4b5b7" class="sans" text-anchor="start" data-text-role="body" >2026-08-31</text>
</svg>